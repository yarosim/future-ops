# Opportunity Pipeline

## Stages
1. **Discovery:** Scout identifies raw opportunities from web/internal data.
2. **Validation:** Verifier scores opportunities based on Revenue Thesis criteria.
3. **Prioritization:** Alex decides which validated opportunities to pursue.

## Triggers
- New data patterns detected by Scout.
- Strategic directive from Alex.

## Outputs
- Scored opportunity briefs.
- Prioritized list of opportunities for packaging.
